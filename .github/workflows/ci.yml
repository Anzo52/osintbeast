name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check --select E4,E7,E9,F src tests

      - name: Verify installed database schemas
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m pip install --no-deps --target "$RUNNER_TEMP/osintbeast-install" "$RUNNER_TEMP"/wheels/osintbeast-*.whl
          cd "$RUNNER_TEMP"
          OSINTBEAST_DB_PATH="$RUNNER_TEMP/osintbeast-test.db" PYTHONPATH="$RUNNER_TEMP/osintbeast-install" python -c "import database; database.setup_database(); database.setup_database(); assert database.query_database(\"SELECT name FROM sqlite_master WHERE name = 'ToolResults'\")"

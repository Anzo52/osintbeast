[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "osintbeast"
version = "0.1.0"
description = "A Python CLI framework for authorized OSINT workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.31,<3",
    "SQLAlchemy>=2.0,<3",
    "simple-term-menu>=1.6,<2",
    "holehe>=1.61,<2",
    "httpx>=0.27,<1",
    "trio>=0.25,<1",
    "Flask>=3.1.1,<4",
]

[project.scripts]
osintbeast = "main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "ruff>=0.11,<1",
]
maigret = [
    "maigret>=0.6.6,<0.7",
]
helix = [
    "helix-osint>=4.4,<5",
]
sherlock = [
    "sherlock-project>=0.16.2,<0.17",
]

[tool.setuptools]
package-dir = {"" = "src", "osintbeast_schemas" = "data/schemas", "data.utils" = "data/utils"}
packages = ["osintbeast_schemas", "data.utils"]
py-modules = [
    "api",
    "background_runs",
    "checkers",
    "backend_services",
    "downloader",
    "holehe_integration",
    "helix_integration",
    "installer",
    "main",
    "maigret_integration",
    "menu_utils",
    "sherlock_integration",
    "tool_runs",
    "tool_registry",
    "web",
    "web_api",
    "web_ui",
]

[tool.setuptools.package-data]
osintbeast_schemas = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "osintbeast"
version = "0.1.0"
description = "A Python CLI framework for authorized OSINT workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.31,<3",
    "SQLAlchemy>=2.0,<3",
    "simple-term-menu>=1.6,<2",
    "holehe>=1.61,<2",
    "httpx>=0.27,<1",
    "trio>=0.25,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["osintbeast_schemas"]
py-modules = [
    "database",
    "downloader",
    "holehe_integration",
    "installer",
    "main",
    "tool_registry",
]

[tool.setuptools.package-data]
osintbeast_schemas = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
